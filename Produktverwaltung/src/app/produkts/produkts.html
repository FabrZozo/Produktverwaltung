<div class="p-3">
  <div class="card">
    <div class="card-header">
      <h3>Produkts List</h3>
    </div>
    <div class="card-body">
      <div>
        <input [(ngModel)]="keyword" type="text"class="m-2">
        <button (click)="search()" type="submit"class="btn btn-outline-success m-2">search</button>
      </div>
      <table class="table">
        <thead>
           <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
           </tr>
           <tr></tr>

         </thead>
        @if (products){
          <tbody>
             @for ( p of products ; track p.id) {
                <tr>
                  <td>{{ p.id }}</td>
                  <td>{{ p.name }}</td>
                  <td>{{ p.price }}</td>
                  <td>
                    <button (click)="deleteProducts(p)" class="btn btn-danger">Delete</button>
                  </td>

                </tr>
             }
          </tbody>
        }
      </table>
    </div>

  </div>

</div>
